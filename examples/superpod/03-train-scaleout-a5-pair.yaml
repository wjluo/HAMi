# 类四 · A5 超节点经 scale-out RDMA 互联（计算面）跨超节点训练
#
# 场景：两套 A5 超节点各接入一个独立的 scale-out RDMA 交换域（SO-SET1 / SO-SET2），
#       三套 fabric 物理隔离 —— 跨 SET1/SET2 之间没有高网通路，只有 25GE 业务面。
# 写法：requirement=compute。调度器把它解析成"必须落在同一个 compute.domain"：
#       · 同域内跨超节点  → 允许（这正是 scale-out 要吃的收益）
#       · 跨域（SET1↔SET2）→ 硬拒，事件里写 domain-isolated，不是低分
#       · SO-SET1 装不下全量 → Pending + "需求 N 卡 > 域容量 M"，不会外溢到 SET2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a5-scaleout-train
  namespace: npu-test
  labels:
    type: train
    hami.io/taskid: a5-scaleout-train
spec:
  replicas: 6            # 需要横跨同一 scale-out 域内的多台超节点计算节点
  selector:
    matchLabels:
      app: a5-scaleout-train
  template:
    metadata:
      labels:
        app: a5-scaleout-train
        type: train
        hami.io/taskid: a5-scaleout-train
      annotations:
        hami.io/fabric-requirement: "compute"
    spec:
      containers:
        - name: trainer
          image: ascendhub.huawei.com/public-ascendhub/ascend-mindspore:23.0.RC3-centos7
          command: ["bash", "-c", "sleep 86400"]
          resources:
            limits:
              huawei.com/Ascend950DT: 8
