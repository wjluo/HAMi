# 推理服务 · PD 分离（业务面可达即可）
#
# 用途：Prefill / Decode 两个角色属于同一个服务，希望收拢在同一个拓扑域里，
#       但通信不敏感，走 25GE 业务面也能跑 —— 所以 requirement=service（全集群恒满足，
#       不设硬门），靠 taskid 做"偏好级"收拢。
# 要点：PD 两侧必须写**同一个** hami.io/taskid，否则会被当成两个互不相关的服务，
#       各锚各的域。
#       hami.io/task-replica-count 让首 Pod 就选到一个装得下整服务的超节点：
#       装不下的域会被"held back"（事件里能看到），而不是等副本陆续到齐后
#       撞在满域外面 Pending。
apiVersion: v1
kind: Pod
metadata:
  name: mindie-prefill
  labels:
    hami.io/taskid: llama-service-001
  annotations:
    hami.io/fabric-requirement: "service"
    # 整服务规模：首 Pod 选域时先剔除"装不下 8 个副本"的超节点，避免后面的副本
    # 到达时才发现域满。写成 Deployment 时可以省略（调度器数得出来），裸 Pod 起
    # 的服务只有业务侧自己知道要开几个。
    hami.io/task-replica-count: "8"
spec:
  containers:
    - name: prefill
      image: ascendhub.huawei.com/public-ascendhub/ascend-mindspore:23.0.RC3-centos7
      command: ["bash", "-c", "sleep 86400"]
      resources:
        limits:
          huawei.com/Ascend950DT: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: mindie-decode
  labels:
    hami.io/taskid: llama-service-001     # 与 prefill 同值 → 收拢到同一域
  annotations:
    hami.io/fabric-requirement: "service" # 两侧取值要一致，否则 Gate 判据不同域
    hami.io/task-replica-count: "8"       # 与 prefill 同值：整个服务的 Pod 总数（两侧之和）
spec:
  containers:
    - name: decode
      image: ascendhub.huawei.com/public-ascendhub/ascend-mindspore:23.0.RC3-centos7
      command: ["bash", "-c", "sleep 86400"]
      resources:
        limits:
          huawei.com/Ascend950DT: 2
